# Serveur de synchronisation Velom3d : docker compose -f Server/docker-compose.yml up -d
# La base est dans le volume « velom3d-data ». Mettez un proxy HTTPS devant (voir README.md).
services:
  velom3d:
    build:
      context: ..
      dockerfile: Server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Velom3d__AllowRegistration: "true"
      Velom3d__TrustProxy: "false"
      # Envoi d'un code par e-mail si on oublie son mot de passe (facultatif, voir README.md) :
      # Velom3d__Smtp__Host: "smtp.exemple.fr"
      # Velom3d__Smtp__User: "velom3d@exemple.fr"
      # Velom3d__Smtp__Password: "..."
    volumes:
      - velom3d-data:/data

volumes:
  velom3d-data:
